name: Generate Signing Key (sekali saja)

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Password keystore (min. 6 karakter, CATAT baik-baik)'
        required: true

jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          PASS='${{ github.event.inputs.password }}'
          echo "::add-mask::$PASS"
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias catatankontrak \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Catatan Kontrak, O=Baim, C=ID"
          base64 -w 0 release.jks > keystore_base64.txt
          cat > PETUNJUK.txt <<'EOF'
          Buka repo GitHub > Settings > Secrets and variables > Actions > New repository secret
          lalu buat 4 secret berikut:

          SIGNING_KEYSTORE_BASE64 = isi seluruh file keystore_base64.txt
          SIGNING_STORE_PASSWORD  = password yang tadi kamu masukkan
          SIGNING_KEY_PASSWORD    = password yang sama
          SIGNING_KEY_ALIAS       = catatankontrak

          Setelah itu HAPUS artifact ini dari halaman Actions (demi keamanan),
          dan simpan release.jks di tempat aman sebagai cadangan.
          EOF

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: |
            release.jks
            keystore_base64.txt
            PETUNJUK.txt
          retention-days: 1
